<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced_GameJam Mirror Setup</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
    code{background:#f4f4f4;padding:2px 6px;border-radius:6px}
    .box{border:1px solid #ddd;border-radius:12px;padding:16px;background:#fafafa}
  </style>
</head>
<body>
  <h1>Advanced_GameJam GitHub Pages 준비 완료</h1>
  <div class="box">
    <p>현재 실행 환경에서 <code>https://github.com/Un-Uclied/Advanced_GameJam</code> 저장소에 대한 직접 접근이 차단되어
    원본을 "완벽 복제"할 수는 없습니다.</p>
    <p>저장소를 이 프로젝트로 가져오려면 아래 중 하나를 제공해 주세요.</p>
    <ul>
      <li>원본 저장소 ZIP 파일 업로드</li>
      <li>원본 파일 트리/핵심 파일 전달</li>
      <li>접근 가능한 미러 URL</li>
    </ul>
    <p>자료를 받는 즉시 동일 구조/스타일로 GitHub.io 사이트를 맞춰드리겠습니다.</p>
  </div>
</body>
</html>
